<!DOCTYPE html>

<html>

<head>

<title>Admin - HR</title>

<style>

body{
margin:0;
font-family:Arial;
background:#f4f6f9;
}

.sidebar{
width:220px;
height:100vh;
background:#1f2937;
color:white;
position:fixed;
padding-top:30px;
}

.sidebar h2{
text-align:center;
margin-bottom:40px;
}

.sidebar a{
display:block;
padding:12px 20px;
color:white;
text-decoration:none;
}

.sidebar a:hover{
background:#374151;
}

.content{
margin-left:220px;
padding:30px;
}

table{
width:100%;
border-collapse:collapse;
background:white;
}

th,td{
padding:12px;
border-bottom:1px solid #ddd;
}

th{
background:#111827;
color:white;
}

.delete{
background:#ef4444;
color:white;
padding:6px 12px;
text-decoration:none;
border-radius:4px;
}

</style>

</head>

<body>

<div class="sidebar">

<h2>Admin</h2>

<a href="/admin">Dashboard</a> <a href="/admin/users">User Control</a> <a href="/admin/hr">HR Control</a> <a href="/admin/jobs">Job Control</a>

</div>

<div class="content">

<h1>HR Management</h1>

<table>

<tr>
<th>ID</th>
<th>Name</th>
<th>Email</th>
<th>Action</th>
</tr>

{% for h in hrs %}

<tr>

<td>{{h[0]}}</td>
<td>{{h[1]}}</td>
<td>{{h[2]}}</td>

<td>
<a class="delete" href="/delete_hr/{{h[0]}}" onclick="return confirmDelete()">Delete</a>
</td>

</tr>

{% endfor %}

</table>

</div>
<script>

function confirmDelete(){

    return confirm("Are you sure you want to delete this record?");

}

</script>

</body>
</html>
