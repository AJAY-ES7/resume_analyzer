<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ResumeAI | Admin Control</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --danger: #ef4444;
            --bg: #0b0f1a;
            --card: #161e2d;
            --sidebar: #111827;
        }

        body {
            margin: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--bg);
            color: #e2e8f0;
            display: flex;
        }

        /* Modern Sidebar */
        .sidebar {
    width: 260px;
    height: 100vh;
    background: #111827; /* Matching the dark theme */
    position: fixed;
    padding: 40px 20px;
    display: flex;
    flex-direction: column;
    box-sizing: border-box;
}
        .logout-btn {
    margin-top: auto;
    padding: 14px 18px;
    background: rgba(239, 68, 68, 0.1);
    color: #ef4444;
    text-decoration: none;
    border-radius: 12px;
    font-weight: 600;
    text-align: center;
}
         .content {
    margin-left: 260px;
    padding: 60px;
    width: calc(100% - 260px);
    box-sizing: border-box;
}

       .sidebar h2 { font-size: 20px; font-weight: 800; color: var(--primary); margin-bottom: 40px; }

        .sidebar a {
            padding: 14px 18px;
            color: #94a3b8;
            text-decoration: none;
            border-radius: 12px;
            margin-bottom: 8px;
            transition: 0.3s;
        }

        .sidebar a:hover, .sidebar a.active {
            background: rgba(99, 102, 241, 0.1);
            color: var(--primary);
        }

        /* Content Area */
        

        h1 { font-size: 32px; font-weight: 700; margin-bottom: 30px; }

        /* Fancy Table */
        .table-container {
            background: var(--card);
            border-radius: 20px;
            padding: 20px;
            border: 1px solid #1e293b;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            animation: slideUp 0.6s ease-out;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0 10px;
        }

        th {
            text-align: left;
            padding: 15px 20px;
            color: #64748b;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        td {
            padding: 20px;
            background: #1e293b;
            transition: 0.3s;
        }

        tr td:first-child { border-radius: 12px 0 0 12px; }
        tr td:last-child { border-radius: 0 12px 12px 0; }

        tr:hover td { background: #262f45; transform: scale(1.005); }

        .delete {
            background: rgba(239, 68, 68, 0.1);
            color: var(--danger);
            padding: 8px 16px;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 13px;
            border: 1px solid rgba(239, 68, 68, 0.2);
            transition: 0.3s;
        }

        .delete:hover {
            background: var(--danger);
            color: white;
        }
        

    </style>
</head>
<body>

<div class="sidebar">
    <h2>ResumeAI <span style="color:white; font-weight:200;">Pro</span></h2>
    <a href="/admin">📊 Dashboard</a>
    <a href="/admin/users" class="active">👥 User Control</a>
    <a href="/admin/hr">💼 HR Control</a>
    <a href="/admin/jobs" >📝 Job Control</a>
    <a href="/logout" class="logout-btn">🚪 Logout</a>
</div>

<div class="content">
    <h1>Management Console</h1>
    
    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name / Role</th>
                    <th>Email / Details</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody>
    {% for u in users %}
    <tr>
        <td>#{{u[0]}}</td> <td><strong>{{u[1]}}</strong></td> <td style="color: #94a3b8;">{{u[2]}}</td> <td>
            <a class="delete" href="/delete_user/{{u[0]}}" onclick="return confirmDelete()">Remove Access</a>
        </td>
    </tr>
    {% endfor %}
</tbody>
        </table>
    </div>
</div>

<script>
function confirmDelete(){
    return confirm("Security Check: Are you sure you want to permanently delete this record?");
}
</script>
</body>
</html>
