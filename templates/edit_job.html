<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Job | ResumeAI Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --bg: #0b0f1a;
            --card: #161e2d;
            --border: #1e293b;
            --text-main: #e2e8f0;
            --text-dim: #94a3b8;
        }

        body {
            background: var(--bg);
            color: var(--text-main);
            font-family: 'Plus Jakarta Sans', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .form-card {
            background: var(--card);
            padding: 40px;
            border-radius: 24px;
            border: 1px solid var(--border);
            width: 100%;
            max-width: 450px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
        }

        h2 { font-size: 24px; font-weight: 800; margin-bottom: 8px; color: white; }
        p { color: var(--text-dim); margin-bottom: 30px; font-size: 14px; }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
            font-weight: 600;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input, textarea {
            width: 100%;
            padding: 14px;
            margin-bottom: 20px;
            background: #0f172a;
            border: 1px solid var(--border);
            color: white;
            border-radius: 12px;
            font-family: inherit;
            box-sizing: border-box;
            transition: 0.3s;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
        }

        button {
            width: 100%;
            padding: 14px;
            background: var(--primary);
            border: none;
            color: white;
            font-weight: 700;
            font-size: 16px;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(99, 102, 241, 0.3);
        }

        .cancel-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: var(--text-dim);
            text-decoration: none;
            font-size: 14px;
            transition: 0.3s;
        }

        .cancel-link:hover { color: white; }
    </style>
</head>
<body>

    <div class="form-card">
        <h2>Update Job Details</h2>
        <p>Modifying details for: <strong>{{ job[1] }}</strong></p>
        
        <form method="POST">
            <label>Position Title</label>
            <input type="text" name="title" value="{{ job[1] }}" required>

            <label>Required Skills</label>
            <textarea name="skills" rows="3" required>{{ job[2] }}</textarea>

            <label>Min. Experience (Years)</label>
            <input type="number" name="experience" value="{{ job[3] }}" required>

            <label>Preferred Education</label>
            <input type="text" name="degree" value="{{ job[4] }}" required>

            <button type="submit">Save Changes</button>
            <a href="/admin/jobs" class="cancel-link">Cancel and Return</a>
        </form>
    </div>

</body>
</html>
